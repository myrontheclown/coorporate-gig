<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Request Service</title>
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface-variant": "#454652",
                        "on-primary": "#ffffff",
                        "on-secondary-fixed-variant": "#005312",
                        "surface": "#f8f9fa",
                        "on-tertiary-fixed-variant": "#7b2e12",
                        "outline": "#767683",
                        "tertiary-fixed": "#ffdbd0",
                        "primary": "#000666",
                        "inverse-surface": "#2e3132",
                        "on-tertiary": "#ffffff",
                        "on-surface": "#191c1d",
                        "surface-bright": "#f8f9fa",
                        "surface-variant": "#e1e3e4",
                        "on-primary-container": "#8690ee",
                        "surface-tint": "#4c56af",
                        "on-background": "#191c1d",
                        "tertiary": "#380b00",
                        "primary-fixed": "#e0e0ff",
                        "on-secondary-fixed": "#002204",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed-variant": "#343d96",
                        "background": "#f8f9fa",
                        "tertiary-fixed-dim": "#ffb59d",
                        "outline-variant": "#c6c5d4",
                        "primary-fixed-dim": "#bdc2ff",
                        "verified-blue": "#2D5BFF",
                        "surface-dim": "#d9dadb",
                        "on-secondary-container": "#217128",
                        "on-tertiary-container": "#e17c5a",
                        "border-light": "#E5E7EB",
                        "on-error-container": "#93000a",
                        "secondary-fixed": "#a3f69c",
                        "surface-container-low": "#f3f4f5",
                        "on-secondary": "#ffffff",
                        "on-error": "#ffffff",
                        "surface-container-highest": "#e1e3e4",
                        "secondary-container": "#a0f399",
                        "surface-container-high": "#e7e8e9",
                        "slate-body": "#4B5563",
                        "tertiary-container": "#5c1800",
                        "inverse-primary": "#bdc2ff",
                        "on-tertiary-fixed": "#390c00",
                        "secondary": "#1b6d24",
                        "on-primary-fixed": "#000767",
                        "surface-container": "#edeeef",
                        "success-green": "#2E7D32",
                        "secondary-fixed-dim": "#88d982",
                        "inverse-on-surface": "#f0f1f2",
                        "error": "#ba1a1a",
                        "charcoal-text": "#121212",
                        "primary-container": "#1a237e",
                        "error-container": "#ffdad6"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-desktop": "64px",
                        "margin-mobile": "20px",
                        "section-gap": "32px",
                        "component-padding": "24px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "headline-md": ["Hanken Grotesk"],
                        "stat-lg": ["Hanken Grotesk"],
                        "display-lg": ["Hanken Grotesk"],
                        "label-caps": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["24px", { "lineHeight": "30px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "stat-lg": ["22px", { "lineHeight": "28px", "fontWeight": "700" }],
                        "display-lg": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.03em", "fontWeight": "800" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "headline-lg": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["14px", { "lineHeight": "22px", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "26px", "fontWeight": "400" }]
                    }
                },
            },
        }
    </script>
<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        
        .premium-shadow {
            box-shadow: 0 8px 24px rgba(0, 6, 102, 0.04);
        }

        .glass-header {
            background: rgba(248, 249, 250, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col font-body-md">
<!-- Top App Bar (Modified for transactional intent) -->
<header class="fixed top-0 w-full z-50 glass-header flex items-center px-margin-mobile h-14 w-full shadow-sm">
<button aria-label="Go back" class="text-on-surface p-2 -ml-2 rounded-full hover:bg-surface-container transition-colors active:scale-95 duration-200" type="button">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary ml-2">Request Service</h1>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 pt-[72px] pb-[100px] px-margin-mobile flex flex-col gap-section-gap overflow-y-auto">
<!-- Selected Service -->
<section class="animate-fade-in-up" style="animation-delay: 0.1s;">
<div class="bg-surface-container-lowest border border-border-light rounded-DEFAULT p-component-padding premium-shadow flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-primary-fixed flex items-center justify-center text-primary-container shrink-0">
<span class="text-2xl">⚡</span>
</div>
<div>
<h2 class="font-label-caps text-label-caps text-slate-body uppercase mb-1">Selected Service</h2>
<p class="font-headline-md text-headline-md text-charcoal-text">Electrical Repair</p>
</div>
</div>
</section>
<!-- Describe Problem -->
<section class="animate-fade-in-up" style="animation-delay: 0.2s;">
<label class="block font-headline-md text-headline-md text-charcoal-text mb-2" for="problem-description">Describe your problem</label>
<textarea class="w-full bg-surface-container-low border-0 rounded-DEFAULT p-4 text-on-surface font-body-lg focus:ring-1 focus:ring-primary focus:bg-surface-container-lowest transition-colors placeholder:text-outline resize-none" id="problem-description" placeholder="Be as descriptive as possible..." rows="4">Kitchen socket stopped working after a spark yesterday.</textarea>
</section>
<!-- Photos -->
<section class="animate-fade-in-up" style="animation-delay: 0.3s;">
<div class="flex items-baseline justify-between mb-2">
<h2 class="font-headline-md text-headline-md text-charcoal-text">Add photos</h2>
<span class="font-label-caps text-label-caps text-slate-body uppercase">Optional</span>
</div>
<p class="text-slate-body font-body-md mb-4">Photos help professionals understand the job before accepting.</p>
<div class="flex gap-4 overflow-x-auto hide-scrollbar pb-2">
<!-- Preview Box -->
<div class="w-24 h-24 rounded-DEFAULT overflow-hidden relative shrink-0 border border-border-light">
<img alt="Socket damage photo" class="w-full h-full object-cover" data-alt="A close up photograph of a burnt electrical kitchen wall socket in a modern Indian home, showing signs of a recent spark. Soft natural lighting from a nearby window highlighting the damage on a clean, light-colored tiled wall. High resolution, realistic style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBEg8qFMZ1rFN79Ax7T8RUWBMotWtxqK8pj7Xwf4xa3iy6MvlXhF62p29GRq-8lqgr4ZlDeZHDqSTvY60ob_CQ6rh6o33BgqoY90nD4nfe1mludEYN_TLK7_Mj33dH7Vw4nv4dTLUCKsbxHbMQ10D5rrzBFohQpTkkFcsmkxMG-tf7sfj_wwPfIFTkhXa3bdAe7xexJbxn7D-BgyzMapAYtTbGkZQabRn98-fQzFFT2-8Jy8fxB9XUq"/>
<div class="absolute inset-0 bg-black/20 flex items-center justify-center opacity-0 hover:opacity-100 transition-opacity">
<button class="text-white bg-black/50 p-1 rounded-full"><span class="material-symbols-outlined text-[18px]" data-icon="close">close</span></button>
</div>
</div>
<!-- Add Photo Box 1 -->
<button class="w-24 h-24 rounded-DEFAULT border border-dashed border-outline-variant bg-surface-container-low flex flex-col items-center justify-center gap-1 text-slate-body hover:bg-surface-container transition-colors shrink-0 active:scale-95 duration-200" type="button">
<span class="material-symbols-outlined" data-icon="add">add</span>
<span class="font-label-caps text-[10px] uppercase">Add Photo</span>
</button>
<!-- Add Photo Box 2 -->
<button class="w-24 h-24 rounded-DEFAULT border border-dashed border-outline-variant bg-surface-container-low flex flex-col items-center justify-center gap-1 text-slate-body hover:bg-surface-container transition-colors shrink-0 active:scale-95 duration-200" type="button">
<span class="material-symbols-outlined" data-icon="add">add</span>
<span class="font-label-caps text-[10px] uppercase">Add Photo</span>
</button>
</div>
</section>
<!-- Schedule & Location -->
<section class="animate-fade-in-up" style="animation-delay: 0.4s;">
<div class="bg-surface-container-lowest border border-border-light rounded-DEFAULT premium-shadow divide-y divide-border-light">
<!-- Date -->
<div class="p-4 flex items-center justify-between cursor-pointer hover:bg-surface-container-low transition-colors group">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors" data-icon="calendar_today">calendar_today</span>
<div>
<span class="block font-label-caps text-label-caps text-slate-body uppercase mb-0.5">Preferred Date</span>
<span class="block font-body-lg text-charcoal-text font-medium">Today</span>
</div>
</div>
<span class="material-symbols-outlined text-outline" data-icon="chevron_right">chevron_right</span>
</div>
<!-- Time -->
<div class="p-4 flex items-center justify-between cursor-pointer hover:bg-surface-container-low transition-colors group">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors" data-icon="schedule">schedule</span>
<div>
<span class="block font-label-caps text-label-caps text-slate-body uppercase mb-0.5">Preferred Time</span>
<span class="block font-body-lg text-charcoal-text font-medium">6:00 PM</span>
</div>
</div>
<span class="material-symbols-outlined text-outline" data-icon="chevron_right">chevron_right</span>
</div>
<!-- Location -->
<div class="p-4 flex flex-col gap-3">
<div class="flex items-start justify-between">
<div class="flex items-start gap-3">
<span class="material-symbols-outlined text-outline mt-1" data-icon="location_on">location_on</span>
<div>
<span class="block font-label-caps text-label-caps text-slate-body uppercase mb-0.5">Service Location</span>
<span class="block font-body-lg text-charcoal-text font-medium">Panaji, Goa</span>
</div>
</div>
</div>
<button class="text-primary font-label-caps text-label-caps uppercase self-start ml-9 hover:text-primary-container transition-colors active:opacity-70" type="button">
                        [Change Location]
                    </button>
</div>
</div>
</section>
</main>
<!-- Bottom Action Bar -->
<div class="fixed bottom-0 w-full bg-surface-container-lowest border-t border-border-light p-margin-mobile pb-safe z-50">
<button class="w-full bg-primary text-on-primary rounded-full min-h-[52px] font-headline-md text-headline-md flex items-center justify-center gap-2 hover:bg-primary-container transition-colors active:scale-[0.98] duration-200 premium-shadow" type="button">
            Find Available Workers
            <span class="material-symbols-outlined" data-icon="arrow_forward" data-weight="fill" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
</button>
</div>
<!-- Simple animations -->
<style>
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.4s ease-out forwards;
            opacity: 0;
        }
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }
    </style>
</body></html>
