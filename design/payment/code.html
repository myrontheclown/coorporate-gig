<body class="bg-background text-on-background min-h-screen flex flex-col md:max-w-screen-md md:mx-auto">
<!-- Header (Transactional - No Navigation Shell per mandate) -->
<header class="flex justify-between items-center w-full px-margin-mobile h-16 bg-surface/80 backdrop-blur-xl sticky top-0 z-50">
<button class="text-primary p-2 -ml-2 rounded-full hover:bg-surface-variant/50 transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="text-headline-md font-headline-md font-bold text-primary">Payment</h1>
<div class="w-10"></div> <!-- Placeholder for balance -->
</header>
<main class="flex-grow px-margin-mobile pt-6 pb-32">
<!-- Summary Card -->
<section class="bg-surface-container-lowest rounded-lg border border-border-light shadow-[0_24px_48px_-12px_rgba(0,6,102,0.04)] p-component-padding mb-section-gap relative overflow-hidden">
<div class="absolute top-0 right-0 p-4 opacity-5 pointer-events-none">

</div>
<div class="flex items-center gap-4 mb-6 relative z-10">
<img class="w-16 h-16 rounded-full object-cover shadow-md border-2 border-white" data-alt="A professional headshot of a confident interior designer wearing a smart casual blazer, warm studio lighting, modern minimalist aesthetic, light clean background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAgxqOPGqGjaQCpATfjQA4qeAv3dRwI2RFz65lkP-BnAYQIy6khGF0PxMMLQdwe3tX0rJZ6up7JKQJgKdMmqmQasTOs-pkXDEuA6gUcuOQ7jOz3oiBXZpv8iHP7tJtD7_epkjyChIFBtW9na1_wp9J-RCBbJD9qnER14S-k62bXD5j0W8QqD5HDw6aEXJDtJh7VzWYQSkjNm2JH7eXIdFnAOjbey31UVkH1k931mTJGiYEhsEZ5uPnz"/>
<div>
<h2 class="text-headline-md font-headline-md text-charcoal-text">Alexa Martinez</h2>
<p class="text-body-md font-body-md text-slate-body">UX/UI Designer • Design Consultation</p>
</div>
</div>
<div class="space-y-4 relative z-10">
<div class="flex justify-between items-center pb-4 border-b border-border-light/50">
<span class="text-body-lg font-body-lg text-slate-body">Service Charge</span>
<span class="text-body-lg font-body-lg font-medium text-charcoal-text">₹800</span>
</div>
<div class="flex justify-between items-center pb-4 border-b border-border-light/50">
<span class="text-body-lg font-body-lg text-slate-body flex items-center gap-1">
                        Platform Fee
                        <span class="material-symbols-outlined text-[16px] text-outline" title="Helps us keep the platform running">info</span>
</span>
<span class="text-body-lg font-body-lg font-medium text-charcoal-text">₹20</span>
</div>
<div class="flex justify-between items-center pb-4 border-b border-border-light/50">
<span class="text-body-lg font-body-lg text-slate-body flex items-center gap-1">
                        Cooperative Share
                        <span class="material-symbols-outlined text-[16px] text-verified-blue">verified</span>
</span>
<span class="text-body-lg font-body-lg font-medium text-charcoal-text">₹50</span>
</div>
<div class="flex justify-between items-center pt-2">
<span class="text-headline-md font-headline-md font-bold text-charcoal-text">Total</span>
<span class="text-display-lg font-display-lg font-extrabold text-primary">₹870</span>
</div>
</div>
</section>
<!-- Payment Methods -->
<section class="mb-section-gap">
<h3 class="text-headline-md font-headline-md font-semibold text-charcoal-text mb-4 px-2">Payment Method</h3>
<div class="space-y-3">
<!-- UPI Option (Selected) -->
<label class="flex items-center p-4 bg-surface-container-lowest border-2 border-primary rounded-lg shadow-sm cursor-pointer transition-all hover:shadow-md relative overflow-hidden group">

<div class="mr-4">
<div class="w-6 h-6 rounded-full border-2 border-primary flex items-center justify-center">
<div class="w-3 h-3 rounded-full bg-primary"></div>
</div>
<input checked="" class="hidden" name="payment_method" type="radio" value="upi"/>
</div>
<div class="flex-grow">
<span class="block text-body-lg font-body-lg font-medium text-charcoal-text">UPI / QR Code</span>
<span class="block text-body-md font-body-md text-slate-body">Google Pay, PhonePe, Paytm</span>
</div>
<span class="material-symbols-outlined text-primary text-2xl">qr_code_scanner</span>
</label>
<!-- Card Option -->
<label class="flex items-center p-4 bg-surface-container-lowest border border-border-light rounded-lg shadow-sm cursor-pointer transition-all hover:shadow-md hover:border-primary/50 relative overflow-hidden group">

<div class="mr-4">
<div class="w-6 h-6 rounded-full border-2 border-outline flex items-center justify-center">
<!-- Unselected state inner circle hidden -->
</div>

</div>
<div class="flex-grow">
<span class="block text-body-lg font-body-lg font-medium text-charcoal-text">Credit / Debit Card</span>
<span class="block text-body-md font-body-md text-slate-body">Visa, Mastercard, RuPay</span>
</div>
<span class="material-symbols-outlined text-outline text-2xl">credit_card</span>
</label>
<!-- Cash Option -->

<div class="absolute inset-0 bg-surface-variant/20 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none"></div>
<div class="mr-4">
<div class="w-6 h-6 rounded-full border-2 border-outline flex items-center justify-center">
</div>

</div>
<div class="flex-grow">
<span class="block text-body-lg font-body-lg font-medium text-charcoal-text">Cash on Completion</span>
<span class="block text-body-md font-body-md text-slate-body">Pay directly to professional</span>
</div>
<span class="material-symbols-outlined text-outline text-2xl">payments</span>
</label>
</div>

            Pay ₹870
            <span class="material-symbols-outlined">arrow_forward</span>
</button>
<p class="text-center mt-3 text-label-caps font-label-caps text-slate-body flex items-center justify-center gap-1 opacity-70">
<span class="material-symbols-outlined text-[14px]">lock</span>
            SECURE ENCRYPTED PAYMENT
        </p>
</div>
<script>
        // Simple script to handle radio button visual selection state
        document.querySelectorAll('input[type="radio"][name="payment_method"]').forEach(radio => {
            radio.addEventListener('change', function() {
                // Reset all labels
                document.querySelectorAll('label').forEach(label => {
                    label.classList.remove('border-primary', 'border-2');
                    label.classList.add('border-border-light', 'border');
                    const indicator = label.querySelector('.w-6.h-6');
                    if(indicator) {
                        indicator.classList.remove('border-primary');
                        indicator.classList.add('border-outline');
                        indicator.innerHTML = ''; // Remove inner dot
                    }
                    const icon = label.querySelector('.material-symbols-outlined:last-child');
                    if(icon) {
                        icon.classList.remove('text-primary');
                        icon.classList.add('text-outline');
                    }
                });

                // Set active state
                if (this.checked) {
                    const activeLabel = this.closest('label');
                    activeLabel.classList.remove('border-border-light', 'border');
                    activeLabel.classList.add('border-primary', 'border-2');
                    
                    const activeIndicator = activeLabel.querySelector('.w-6.h-6');
                    activeIndicator.classList.remove('border-outline');
                    activeIndicator.classList.add('border-primary');
                    activeIndicator.innerHTML = '<div class="w-3 h-3 rounded-full bg-primary"></div>';

                     const activeIcon = activeLabel.querySelector('.material-symbols-outlined:last-child');
                    if(activeIcon) {
                        activeIcon.classList.remove('text-outline');
                        activeIcon.classList.add('text-primary');
                    }
                }
            });
        });
    </script>
