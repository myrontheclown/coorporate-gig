<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .soft-shadow {
            box-shadow: 0px 12px 24px rgba(0, 6, 102, 0.04);
        }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background min-h-screen font-body-md antialiased pb-24">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-background shadow-sm">
<div class="flex justify-between items-center px-container-padding h-14 w-full">
<div class="flex items-center gap-3">
<img alt="User profile avatar" class="w-8 h-8 rounded-full object-cover border border-border-light" data-alt="A professional headshot of an Indian service provider with a warm smile, wearing a clean, branded navy blue uniform. The lighting is soft and flattering, creating a trustworthy and reliable appearance against a neutral light grey background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDH0XxdUGdz-v9P5TZNVzUn5On-GFXOn7CQTV-ewZV9vhWyMQffMIXd4we0Hq05avW4vGcpjjdxX45g3pnwXBUfHi5Di6SXSFuSc8-dtfO5Sm_Lrm8_UY6JU7TJx3TWcTF8E8Ex95tEkgetBuQ-lLawbn9-ilGORmxTPUM8D3qnpg1zKam8OD2tgvYn6wa1oEeNhUnrBARI2Q6aUu9h98k37Ze6tejRO6EhwQZAy_ia3fNQmqSVNThr"/>
</div>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim">Bharat Seva</h1>
<button class="w-8 h-8 flex items-center justify-center text-primary dark:text-primary-fixed-dim hover:bg-surface-container dark:hover:bg-surface-container-highest transition-colors rounded-full active:scale-95 duration-200">
<span class="material-symbols-outlined">notifications</span>
</button>
</div>
</header>
<!-- Main Content -->
<main class="pt-20 px-margin-mobile max-w-[1200px] mx-auto pb-safe">
<!-- Header Section -->
<section class="mb-section-gap pt-4">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-charcoal-text mb-1">My Bookings</h1>
<p class="font-body-md text-body-md text-slate-body">Track your current and previous services</p>
</section>
<!-- Tabs -->
<div class="flex gap-2 mb-6 overflow-x-auto hide-scrollbar pb-2">
<button class="px-6 py-2 rounded-full font-label-caps text-label-caps bg-primary text-on-primary whitespace-nowrap transition-colors shadow-sm">Upcoming</button>
<button class="px-6 py-2 rounded-full font-label-caps text-label-caps bg-surface-container-low text-on-surface-variant hover:bg-surface-container whitespace-nowrap transition-colors border border-border-light">Active</button>
<button class="px-6 py-2 rounded-full font-label-caps text-label-caps bg-surface-container-low text-on-surface-variant hover:bg-surface-container whitespace-nowrap transition-colors border border-border-light">Completed</button>
</div>
<!-- Upcoming List -->
<div class="flex flex-col gap-gutter" id="upcoming-list">
<!-- Card 1 -->
<div class="bg-surface-container-lowest rounded-xl border border-border-light p-component-padding soft-shadow relative overflow-hidden">
<!-- Status Badge -->
<div class="inline-flex items-center gap-1 px-3 py-1 bg-secondary-container text-on-secondary-container rounded-full mb-4">
<span class="material-symbols-outlined text-[14px]">check_circle</span>
<span class="font-label-caps text-label-caps">CONFIRMED</span>
</div>
<h3 class="font-headline-md text-headline-md text-charcoal-text mb-2">AC Installation</h3>
<div class="flex items-center gap-3 mb-4">
<div class="flex-shrink-0 w-10 h-10 bg-surface-container rounded-full overflow-hidden flex items-center justify-center">
<span class="material-symbols-outlined text-outline">person</span>
</div>
<div>
<p class="font-body-md text-body-md font-semibold text-charcoal-text">Rajesh Kumar</p>
<div class="flex items-center gap-1 text-slate-body">
<span class="material-symbols-outlined text-[14px] text-tertiary-container">star</span>
<span class="font-label-caps text-label-caps">4.8</span>
</div>
</div>
</div>
<div class="grid grid-cols-2 gap-4 mb-6">
<div class="flex flex-col gap-1">
<span class="font-label-caps text-label-caps text-outline uppercase">Date &amp; Time</span>
<div class="flex items-center gap-1 text-charcoal-text">
<span class="material-symbols-outlined text-[16px]">schedule</span>
<span class="font-body-md text-body-md font-medium">Tomorrow · 10:00 AM</span>
</div>
</div>
<div class="flex flex-col gap-1">
<span class="font-label-caps text-label-caps text-outline uppercase">Location</span>
<div class="flex items-center gap-1 text-charcoal-text">
<span class="material-symbols-outlined text-[16px]">location_on</span>
<span class="font-body-md text-body-md font-medium">Panaji, Goa</span>
</div>
</div>
</div>
<div class="flex items-center justify-between border-t border-border-light pt-4 mb-6">
<div class="flex flex-col">
<span class="font-label-caps text-label-caps text-outline uppercase">Est. Price</span>
<span class="font-stat-lg text-stat-lg text-primary">₹900–₹1,200</span>
</div>
</div>
<button class="w-full bg-primary text-on-primary rounded-full min-h-[52px] font-label-caps text-label-caps uppercase tracking-wider hover:opacity-90 transition-opacity active:scale-[0.98]">
                    View Booking
                </button>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 bg-surface dark:bg-background shadow-[0px_-4px_12px_rgba(0,0,0,0.05)] md:hidden">
<div class="flex justify-around items-center h-16 pb-safe w-full">
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant hover:bg-surface-container-low dark:hover:bg-surface-container-highest active:scale-98 transition-transform duration-200 w-full h-full">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">home</span>
<span class="font-label-caps text-[10px] uppercase">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-primary dark:text-primary-fixed-dim hover:bg-surface-container-low dark:hover:bg-surface-container-highest active:scale-98 transition-transform duration-200 w-full h-full">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">assignment</span>
<span class="font-label-caps text-[10px] uppercase">Requests</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant hover:bg-surface-container-low dark:hover:bg-surface-container-highest active:scale-98 transition-transform duration-200 w-full h-full">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">person</span>
<span class="font-label-caps text-[10px] uppercase">Profile</span>
</button>
</div>
</nav>
