<div>

<p class="text-body-md font-body-md text-slate-body mt-1">UX/UI Designer</p>
</div>
</section>

<button class="text-surface-dim hover:text-primary transition-colors"><span class="material-symbols-outlined fill text-5xl">star</span></button>

</div>

<button><span class="material-symbols-outlined fill text-primary text-2xl">star</span></button>
